name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build Docker Stack & Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Create .env file from .env.example
        run: cp .env.example .env

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Wait for PostgreSQL to become healthy
        run: |
          for i in {1..30}; do
            if docker compose ps postgres | grep -q "healthy"; then
              echo "✅ PostgreSQL is healthy"
              exit 0
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done
          echo "❌ PostgreSQL failed to become healthy"
          docker compose logs postgres
          exit 1

      - name: Wait for backend health endpoint
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000/health | grep -q "UP"; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "⏳ Waiting for backend... ($i/30)"
            sleep 2
          done
          echo "❌ Backend health check failed"
          docker compose logs backend
          exit 1

      - name: Create test database
        run: |
          docker compose exec -T postgres psql -U postgres -c "CREATE DATABASE opsticket_test;" || echo "ℹ️ Test database may already exist"

      - name: Run backend tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: opsticket_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret-for-ci
          FRONTEND_URL: http://localhost:5173
          NODE_ENV: test
        run: |
          cd backend
          npm test

      - name: Print Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v
