name: "OpsTicket Core Infrastructure Deployment"

on:
  push:
    branches:
      - main # Triggers the pipeline automatically when code changes hit main
  workflow_dispatch: # Keeps our "Manual Trigger" button active so we can run/destroy manually

permissions:
  id-token: write # CRITICAL: Required for requesting the OIDC JWT token from AWS
  contents: read # Required to check out the repository code

jobs:
  terraform-deploy:
    name: "Authenticate, Validate and Deploy"
    runs-on: ubuntu-latest

    # Set the working directory to our core terraform folder, completely skipping the bootstrap folder
    defaults:
      run:
        working-directory: ./terraform

    steps:
      # Step 1: Clone the code onto the GitHub Action runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: The Security Handshake (OIDC authentication with AWS)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::308916794074:role/opsticket-github-actions-role" # <-- CHANGE THIS to your exact role ARN
          aws-region: "us-east-1"
          audience: "sts.amazonaws.com"

      # Step 3: Install Terraform on the runner
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0" # Pins our binary version for pipeline stability

      # Step 4: Strict Pipeline Lint Checks
      - name: Terraform Format Check
        run: terraform fmt -check

      # Step 5: Network/Storage System Initialization
      - name: Terraform Init
        run: terraform init

      # Step 6: Code Syntax Verification
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Blueprint Preview Generation
      - name: Terraform Plan
        run: terraform plan -no-color

      # Step 8: Production Rollout with Secret Injection
      - name: Terraform Apply
        run: terraform apply -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }} # Pulls securely from GitHub's vault
