name: "OpsTicket Platform - Provision & Build"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Choose action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan          # Terraform plan only — no infra changes, no image builds
          - apply         # Terraform apply + build & push images + ECS redeploy
          - build-only    # Skip terraform — just build & push images + ECS redeploy

permissions:
  id-token: write
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Terraform (skipped for build-only)
  # ─────────────────────────────────────────────────────────────
  terraform:
    name: "Infrastructure Automation"
    runs-on: ubuntu-latest
    if: ${{ inputs.action != 'build-only' }}
    defaults:
      run:
        working-directory: ./terraform
    outputs:
      app_url: ${{ steps.tf_output.outputs.app_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::308916794074:role/opsticket-github-actions-role"
          aws-region: "us-east-1"
          audience: "sts.amazonaws.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        if: ${{ inputs.action == 'plan' }}
        run: terraform plan -no-color

      - name: Terraform Apply
        if: ${{ inputs.action == 'apply' }}
        run: terraform apply -auto-approve

      # Query the ALB DNS directly via AWS CLI — avoids terraform wrapper exit-code noise
      - name: Capture App URL
        id: tf_output
        if: ${{ inputs.action == 'apply' }}
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names opsticket-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")
          if [[ -n "$ALB_DNS" && "$ALB_DNS" != "None" ]]; then
            APP_URL="http://$ALB_DNS"
          else
            APP_URL="(ALB not yet provisioned — run terraform apply first)"
          fi
          echo "app_url=$APP_URL" >> $GITHUB_OUTPUT
          echo "🌐 Live URL: $APP_URL"

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker Images (apply or build-only)
  # ─────────────────────────────────────────────────────────────
  docker:
    name: "App Image Build & Push"
    runs-on: ubuntu-latest
    # Runs after terraform when action=apply; runs standalone when action=build-only
    needs: [terraform]
    if: |
      always() &&
      (inputs.action == 'apply' || inputs.action == 'build-only') &&
      (needs.terraform.result == 'success' || needs.terraform.result == 'skipped')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::308916794074:role/opsticket-github-actions-role"
          aws-region: "us-east-1"
          audience: "sts.amazonaws.com"

      # Securely logs the runner's Docker daemon into your AWS ECR Registry
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Compiles, tags, and pushes your production Node backend image
      - name: Build and Push Backend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: opsticket-backend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Compiles, tags, and pushes your production React frontend image
      - name: Build and Push Frontend Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: opsticket-frontend
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Force ECS to pull the new :latest images and do a rolling restart
      # Without this, ECS keeps the old container running even after ECR is updated
      - name: Force ECS Redeployment
        run: |
          echo "🔄 Forcing ECS services to redeploy with new images..."
          aws ecs update-service \
            --cluster opsticket-ecs-cluster \
            --service opsticket-backend-service \
            --force-new-deployment \
            --no-cli-pager
          aws ecs update-service \
            --cluster opsticket-ecs-cluster \
            --service opsticket-frontend-service \
            --force-new-deployment \
            --no-cli-pager
          echo "✅ Rolling restart triggered for both services."

      # Print a deployment summary with the live URL in the Actions run log
      - name: "🚀 Deployment Summary"
        run: |
          # Re-query ALB via AWS CLI — no terraform wrapper issues
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names opsticket-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")
          if [[ -n "$ALB_DNS" && "$ALB_DNS" != "None" ]]; then
            APP_URL="http://$ALB_DNS"
          else
            APP_URL="(ALB not found — has terraform apply been run?)"
          fi
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║           ✅ OpsTicket Deployment Complete!          ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  🌐 App URL  : $APP_URL"
          echo "║  🔌 API URL  : $APP_URL/api"
          echo "║  ❤️  Health  : $APP_URL/api/health"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
          # Write clickable links to the GitHub Actions job summary tab
          echo "## 🚀 OpsTicket Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 App | [$APP_URL]($APP_URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔌 API | [$APP_URL/api]($APP_URL/api) |" >> $GITHUB_STEP_SUMMARY
          echo "| ❤️ Health | [$APP_URL/api/health]($APP_URL/api/health) |" >> $GITHUB_STEP_SUMMARY
