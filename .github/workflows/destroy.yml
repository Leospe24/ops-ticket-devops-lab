name: "OpsTicket Platform - Teardown Switch"

on:
  workflow_dispatch: # Strictly manual trigger only (No accidental push triggers)

permissions:
  id-token: write
  contents: read

jobs:
  terraform-destroy:
    name: "Execute Complete Teardown"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::308916794074:role/opsticket-github-actions-role"
          aws-region: "us-east-1"
          audience: "sts.amazonaws.com"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve
        env:
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
